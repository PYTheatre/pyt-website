      # --- Casting page ---
      - name: "casting-page"
        label: "Casting Page"
        file: "src/content/settings/casting-page.json"
        description: "The Casting page — text content plus the hero image."
        fields:
          - { name: "title", label: "Page title", widget: "string", default: "Casting" }
          - { name: "hero_image", label: "Hero image", widget: "image", required: false, hint: "Upload a wide image for the top of the page. If empty, a colored placeholder is used." }
          - { name: "body", label: "Page body (Markdown supported)", widget: "markdown", hint: "Use blank lines between paragraphs. Bulleted lists with - work too." }
          - { name: "closing_quote", label: "Closing quote (large, pulled out)", widget: "string", required: false, hint: "The line shown in large type at the bottom of the page." }
          - { name: "cta_label", label: "Call-to-action button label", widget: "string", default: "See our shows" }
          - { name: "cta_url", label: "Call-to-action button URL", widget: "string", default: "/shows" }
       # --- Audition page ---
      # The /audition page. The list of shows currently casting is pulled
      # automatically from the Shows collection (any show with a sign-up
      # link whose audition end date hasn't passed), so it is NOT edited
      # here. This record covers the page's words: hero, the Stories on
      # Stage panel, the casting-philosophy panel, and the FAQ list.
      - name: "audition-page"
        label: "Audition Page"
        file: "src/content/settings/audition-page.json"
        description: "The /audition page wording. The shows currently casting are pulled automatically from your Shows — to change a show's description on this page, edit that show's 'Auditions page — short description'. The hero photo is set in Page Hero Images. The link to the casting philosophy page now lives inside the intro paragraph below — add or edit it there."
        fields:
          - { name: "title", label: "Hero — page title", widget: "string", default: "Auditions" }
          - name: "intro"
            label: "Hero — intro paragraph"
            widget: "markdown"
            required: false
            # Limited toolbar on purpose: this is a short intro paragraph,
            # not an article. Headings/lists/images here would fight the
            # page title directly above it.
            buttons: ["bold", "italic", "link"]
            editor_components: []
            hint: "The paragraph under the page title. To add a link (for example to the casting philosophy page): select the words you want to link, click the link button, and enter the address — use /casting for a page on this site. Links show in pink."
          - { name: "shows_heading", label: "Auditions column — heading", widget: "string", required: false, default: "Upcoming auditions", hint: "Sits above the audition cards on the left." }
          - { name: "no_open_message", label: "Message shown when no shows are currently casting", widget: "text", required: false, hint: "Shown under the cards when no Center Stage Musicals auditions are open. Stories on Stage still shows its own card. Example: There are no Center Stage Musicals auditions open right now — check back soon." }
          - { name: "sos_heading", label: "Stories on Stage card — heading", widget: "string", required: false, default: "Stories on Stage", hint: "Stories on Stage now appears as a card alongside the shows, in the same style." }
          - { name: "sos_blurb", label: "Stories on Stage card — description", widget: "text", required: false, hint: "The couple of lines under the heading, matching the show cards." }
          - { name: "sos_button_label", label: "Stories on Stage card — button label", widget: "string", required: false, default: "Auditions", hint: "Keep it short — the buttons are sized to their label." }
          # --- Card buttons and links (2026-08-21) ---
          # These were previously fixed in the code, which is why only the
          # Stories on Stage button could be edited.
          - { name: "signup_button_label", label: "Show cards — sign-up button text", widget: "string", required: false, default: "Sign up", hint: "Shown when a show has an audition sign-up link. Keep it short — buttons are sized to their label." }
          - { name: "coming_soon_label", label: "Show cards — button text when sign-up isn't open yet", widget: "string", required: false, default: "Coming soon", hint: "Shown instead of the sign-up button when a show has no sign-up link yet. It isn't clickable." }
          - { name: "about_show_link_label", label: "Show cards — link text next to the button", widget: "string", required: false, default: "About this show", hint: "The pink link beside the button, going to that show's own page. An arrow is added automatically." }
          - { name: "button_case", label: "Card buttons — capitalization", widget: "select", options: [{ label: "As typed", value: "as-typed" }, { label: "UPPERCASE", value: "uppercase" }], default: "as-typed", hint: "Applies to all three card buttons together, so they stay consistent. 'As typed' shows exactly what you wrote above." }
          - { name: "faq_heading", label: "FAQ column — heading", widget: "string", required: false, default: "Frequently asked questions", hint: "Sits above the FAQ list on the right." }
          - name: "faqs"
            label: "FAQ items"
            widget: "list"
            required: false
            summary: "{{fields.question}}"
            hint: "Add as many questions as you like. The whole FAQ section hides automatically if this list is empty."
            fields:
              - { name: "question", label: "Question", widget: "string" }
              - { name: "answer", label: "Answer", widget: "text" }
 
