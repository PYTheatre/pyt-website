      # --- Contact Form Endpoints (2026-08-20) ---
      # Published email addresses were removed from the site and replaced
      # with contact forms. Enquiries used to reach different people, so
      # there are three separate destinations rather than one shared inbox.
      # Each is a Formspree form — create one per destination at
      # formspree.io, set its notification email to the address shown
      # below, then paste its endpoint URL here.
      - name: "contact-forms"
        label: "Contact Form Endpoints"
        file: "src/content/settings/contact-forms.json"
        description: "Where the contact forms on the site send their messages. Each box is a Formspree form address. Until a box is filled in, forms using it show a short holding message instead."
        fields:
          - { name: "general", label: "General enquiries", widget: "string", required: false, hint: "Used by: About/Contact, Employment, Stories on Stage. Previously went to info@pytnet.org. Paste the Formspree endpoint, e.g. https://formspree.io/f/abcdwxyz" }
          - { name: "education", label: "Schools, bookings & education", widget: "string", required: false, hint: "Used by: School Play in a Box, School Tickets, Stories on Stage bookings, Classes & Camps. Previously went to caitlyn@pytnet.org and lhatten@pytnet.org." }
          - { name: "development", label: "Sponsorship & corporate giving", widget: "string", required: false, hint: "Used by: Ways to Support (corporate giving). Previously went to lhatten@pytnet.org." }
          - { name: "unavailable_note", label: "Message shown if an address above is blank", widget: "text", required: false, hint: "Shown in place of the form. Deliberately does NOT include an email address — publishing one is what these forms replace." }

      # --- Page Hero Images (2026-08-20) ---
      # One optional wide photo per page, all managed together here
      # rather than scattered across each page's own record — several
      # pages (Shop, Subscribe) have no settings record of their own,
      # so this is the only place they can be given one.
      - name: "page-heroes"
        label: "Page Hero Images"
        file: "src/content/settings/page-heroes.json"
        description: "An optional wide photo near the top of any page (not the home page). Add a row per page. Any page without a row simply has no photo — nothing breaks and no empty space is left."
        fields:
          - name: "items"
            label: "Hero images"
            widget: "list"
            summary: "{{fields.page}}"
            hint: "One row per page. A page can only have one hero image. Best photo shape is wide and landscape — it's shown as a short banner strip and gets cropped to fit, so avoid anything where the important part is near the very top or bottom. Each page needs its own row — a photo set here applies to that page only, and does not carry down to pages beneath it. Individual show and production pages already open with their own poster and details, so they're deliberately not listed."
            fields:
              - name: "page"
                label: "Which page"
                widget: "select"
                hint: "Pick the page this photo belongs to."
                options:
                  - { label: "About", value: "/about" }
                  - { label: "Auditions", value: "/audition" }
                  - { label: "Calendar", value: "/calendar" }
                  - { label: "Casting", value: "/casting" }
                  - { label: "Center Stage Musicals", value: "/musicals" }
                  - { label: "Judy Robe & Spirit Awards", value: "/judy-robe-spirits-awards" }
                  - { label: "Newsletter signup", value: "/subscribe" }
                  - { label: "Opportunities / Employment", value: "/employment" }
                  - { label: "Photos", value: "/photos" }
                  - { label: "Press", value: "/press" }
                  - { label: "Classes & Camps", value: "/programs" }
                  - { label: "Rentals", value: "/rentals" }
                  - { label: "School Play in a Box", value: "/school-play-in-a-box" }
                  - { label: "School Tickets", value: "/school-tickets" }
                  - { label: "Shop", value: "/shop" }
                  - { label: "Shows (the list page)", value: "/shows" }
                  - { label: "Stories on Stage (the list page)", value: "/stories-on-stage" }
                  - { label: "Studio Shows", value: "/studio-productions" }
                  - { label: "Ways to Support", value: "/ways-to-support" }
              - { name: "image", label: "Photo", widget: "image", hint: "A wide landscape photo works best. Leave a row out entirely rather than adding one with no photo." }
              - { name: "focus", label: "Vertical focus (%)", widget: "number", required: false, default: 50, value_type: "int", min: 0, max: 100, step: 5, hint: "Which part of the photo to keep when it's cropped to the banner shape. 0 = top, 50 = middle (the default), 100 = bottom. If someone's face is being cut off at the top, lower this — around 15-25 usually does it. Leave blank for the middle." }
              - { name: "alt", label: "Photo description (optional)", widget: "string", required: false, hint: "For screen readers. Leave blank if the photo is purely decorative and the page text already says everything important." }

